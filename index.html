function exerciseCards(items){return '<div class="exercise-grid">'+items.map(e=>'<button type="button" class="exercise" data-guide="'+esc(e.id)+'" aria-label="View guide: '+esc(e.name)+'"><span class="exercise-art">'+movementArt(e)+'</span><span class="exercise-body"><strong>'+esc(e.name)+'</strong><span>'+esc(e.group)+' · '+e.sets+' × '+e.reps+(e.kind==='seconds'?' sec':' reps')+'</span><span class="guide-link">View movement guide ↗</span></span></button>').join('')+'</div>'}
function selectDate(d){selected=d;session=null;render()}function chooseRoutine(d,r){data.overrides[d]=r||null;save();session=null;render()}function workout(){let id=routineFor(selected),r=routine(id);let head=pageHeader('Workout studio',fmt(selected));let options='<div class="row"><button class="ghost" onclick="selectDate(\''+addDays(selected,-1)+'\')">← Previous</button><button class="ghost" onclick="selectDate(\''+addDays(selected,1)+'\')">Next →</button><input aria-label="Workout date" type="date" value="'+selected+'" onchange="selectDate(this.value)"></div><div class="tabs">'+data.routines.map(a=>'<button class="tab '+(id===a.id?'active':'')+'" onclick="chooseRoutine(\''+selected+'\',\''+a.id+'\')">'+a.id+' · '+esc(a.name)+'</button>').join('')+'<button class="tab '+(!id?'active':'')+'" onclick="chooseRoutine(\''+selected+'\',\'\')">Rest / unscheduled</button></div>';if(!r)return head+options+'<div class="empty">No workout scheduled for this date. Choose a routine above to add one.</div>';let html=head+options+'<div class="panel"><div class="row between"><div>'+label('PHYSIOTHERAPIST EXERCISES')+'<h2>'+esc(r.name)+'</h2><p class="muted tiny">'+esc(r.note)+'</p></div><div class="timer" id="timerDisplay">00:00</div></div><div class="row"><button class="secondary" onclick="startTimer(60)">1m rest</button><button class="secondary" onclick="startTimer(90)">90s rest</button><button class="secondary" onclick="startTimer(120)">2m rest</button><button class="ghost" onclick="stopTimer()">Stop</button></div></div><div class="notice" style="margin-top:12px">Only sets you explicitly confirm count towards your results. Prescribed weights are examples from your screenshots, not proof of completed lifts. Exercise groupings are provisional.</div>';for(const eid of r.ids){const e=ex(eid);if(!e)continue;let records=data.logs[selected]?.sets||[];html+='<div class="workout-ex"><div class="ex-title"><div><h3>'+esc(e.name)+'</h3><p>'+esc(e.group)+' · '+e.sets+' sets · '+e.rest+' sec rest</p></div><button type="button" data-guide="'+esc(eid)+'" aria-label="View guide: '+esc(e.name)+'">Guide ↗</button></div>'+previousHtml(eid)+'<div class="sethead"><div>Set</div><div>'+(e.kind==='seconds'?'Seconds':'Reps')+'</div><div>Weight kg</div><div>Done</div></div>';for(let i=0;i<e.sets;i++){let s=records.find(x=>x.exerciseId===eid&&x.index===i);let rep=s?s.reps:e.reps,wt=s?s.weight:(e.weights[i]??'');html+='<div class="setrow"><b>'+(i+1)+'</b><input aria-label="Repetitions for '+esc(e.name)+' set '+(i+1)+'" type="number" min="0" step="1" id="rep-'+eid+'-'+i+'" value="'+esc(rep)+'" oninput="markEdited(\''+eid+'\','+i+')"><input aria-label="Weight for '+esc(e.name)+' set '+(i+1)+'" type="number" min="0" step="0.5" id="wt-'+eid+'-'+i+'" placeholder="—" value="'+esc(wt)+'" oninput="markEdited(\''+eid+'\','+i+')"><button id="check-'+eid+'-'+i+'" class="'+(s?.confirmed?'checked':'')+'" onclick="confirmSet(\''+eid+'\','+i+')" aria-label="Confirm set">'+(s?.confirmed?'✓':'○')+'</button></div>'}html+='<div class="row between"><span class="completed" data-exercise="'+esc(eid)+'">'+records.filter(s=>s.exerciseId===eid&&s.confirmed).length+' / '+e.sets+' confirmed</span><button class="ghost" onclick="startTimer('+e.rest+')">Rest '+e.rest+'s ↻</button></div></div>'}return html+'<div class="panel"><div class="row between"><div><strong>Session progress</strong><div class="muted tiny" id="sessionCount">'+confirmed(selected).length+' verified sets recorded</div></div><button class="primary" onclick="finishWorkout()">Finish session ✓</button></div></div>'}
function updateCounts(){document.querySelectorAll('[data-exercise]').forEach(el=>{let eid=el.dataset.exercise;el.textContent=confirmed(selected).filter(s=>s.exerciseId===eid).length+' / '+ex(eid).sets+' confirmed'});let count=document.getElementById('sessionCount');if(count)count.textContent=confirmed(selected).length+' verified sets recorded'}
function markEdited(eid,i){let btn=document.getElementById('check-'+eid+'-'+i);if(btn){btn.classList.remove('checked');btn.textContent='○'}let log=data.logs[selected];if(log){let s=log.sets.find(x=>x.exerciseId===eid&&x.index===i);if(s){s.confirmed=false;save()}}updateCounts()}function confirmSet(eid,i){let reps=Number(document.getElementById('rep-'+eid+'-'+i).value),w=document.getElementById('wt-'+eid+'-'+i).value;if(!Number.isFinite(reps)||reps<0||!Number.isInteger(reps)||w!==''&&(!Number.isFinite(Number(w))||Number(w)<0)){alert('Please enter valid repetitions and weight.');return}let log=data.logs[selected]||(data.logs[selected]={date:selected,sets:[]});let pos=log.sets.findIndex(s=>s.exerciseId===eid&&s.index===i);let prev=pos>=0?log.sets[pos]:null;let obj={exerciseId:eid,index:i,reps,weight:w===''?null:Number(w),confirmed:!prev?.confirmed,updatedAt:new Date().toISOString()};if(pos>=0)log.sets[pos]=obj;else log.sets.push(obj);save();let b=document.getElementById('check-'+eid+'-'+i);b.classList.toggle('checked',obj.confirmed);b.textContent=obj.confirmed?'✓':'○';updateCounts();}function finishWorkout(){let c=confirmed(selected).length;if(!c){alert('Confirm at least one completed set before finishing.');return}data.logs[selected].finishedAt=new Date().toISOString();save();alert('Workout saved locally: '+c+' confirmed sets.');navigate('Dashboard')}
function startTimer(seconds){timerUntil=Date.now()+seconds*1000;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimer,250);updateTimer()}function stopTimer(){timerUntil=0;if(timerInterval)clearInterval(timerInterval);updateTimer()}function updateTimer(){let el=document.getElementById('timerDisplay');if(!el)return;let s=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s&&timerInterval){clearInterval(timerInterval);timerInterval=null}}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let html=pageHeader('Training calendar','Monday · Wednesday · Friday · Unlimited future planning')+'<div class="panel" style="margin-top:24px"><div class="row between"><button class="secondary" onclick="moveMonth(-1)">←</button><h2>'+first.toLocaleDateString('en-AU',{month:'long',year:'numeric'})+'</h2><button class="secondary" onclick="moveMonth(1)">→</button></div><div class="calendar">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(x=>'<div class="calhead">'+x+'</div>').join('');for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){let d=new Date(y,m,i-offset+1),s=iso(d),r=routineFor(s),c=confirmed(s).length;html+='<button class="calcell '+(d.getMonth()!==m?'other ':'')+(r?'scheduled ':'')+(c?'done ':'')+(s===selected?'selected':'')+'" onclick="selectCalendarDate(\''+s+'\')">'+d.getDate()+'<small>'+(c?'✓ '+c+' sets':r?'● '+r:'')+'</small></button>'}html+='</div></div><div class="panel" style="margin-top:14px"><div class="row between"><div><strong>'+fmt(selected)+'</strong><div class="muted tiny">'+(routineFor(selected)?esc(routine(routineFor(selected))?.name):'Recovery / unscheduled')+'</div></div><button class="primary" onclick="navigate(\'Workout\')">Open day →</button></div></div>';return html}function moveMonth(n){month.setMonth(month.getMonth()+n);render()}function selectCalendarDate(s){selected=s;render()}
function exercises(){return pageHeader('Exercise library',data.exercises.length+' exercises · Sourced from your physiotherapist screenshots')+'<div class="notice" style="margin:20px 0">Open any movement for diagrams, step-by-step cues and a demonstration source. These are general technique references; your physiotherapist’s instructions take priority. Original workout groupings remain provisional.</div><div class="row between" style="margin-bottom:15px"><h2>All movements</h2><button class="primary" onclick="addExercise()">+ Add exercise</button></div>'+exerciseCards(data.exercises)+'<section class="section"><h2>Edit workout groupings</h2>'+data.routines.map(r=>'<div class="panel" style="margin:12px 0"><strong>'+r.id+' · '+esc(r.name)+'</strong><p class="muted tiny">'+esc(r.note)+'</p><textarea id="routine-'+r.id+'">'+esc(r.ids.join(', '))+'</textarea><div class="muted tiny">Comma-separated exercise IDs. Available IDs: '+data.exercises.map(e=>esc(e.id)).join(', ')+'</div><button class="secondary" style="margin-top:10px" onclick="saveRoutine(\''+r.id+'\')">Save grouping</button></div>').join('')+'</section>'}function addExercise(){let name=prompt('New exercise name');if(!name?.trim())return;let id='custom-'+Date.now();data.exercises.push({id,name:name.trim(),sets:3,reps:10,weights:[],rest:90,art:'🏋️',kind:'strength',group:'Custom'});save();render()}function saveRoutine(id){let raw=document.getElementById('routine-'+id).value.split(',').map(x=>x.trim()).filter(Boolean),invalid=raw.filter(id=>!ex(id));if(invalid.length){alert('Unknown exercise IDs: '+invalid.join(', '));return}routine(id).ids=raw;save();alert('Routine updated');render()}
function progress(){let logs=Object.entries(data.logs).filter(([d,l])=>(l.sets||[]).some(s=>s.confirmed)).sort((a,b)=>a[0].localeCompare(b[0]));let recent=logs.slice(-8),values=recent.map(([d,l])=>l.sets.filter(s=>s.confirmed).reduce((a,s)=>a+(s.weight||0)*s.reps,0)),max=Math.max(1,...values);return pageHeader('Progress & insights','Only confirmed training contributes to statistics')+'<div class="stats" style="margin-top:24px"><div class="stat"><div class="label">Verified workouts</div><div class="number">'+countWorkouts()+'</div></div><div class="stat"><div class="label">Confirmed sets</div><div class="number">'+totalConfirmed()+'</div></div><div class="stat"><div class="label">Height</div><div class="number">'+data.profile.height+'<small> cm</small></div></div><div class="stat"><div class="label">Starting weight</div><div class="number">'+data.profile.weight+'<small> kg</small></div></div></div><section class="section panel"><h2>Confirmed external-load volume</h2><p class="muted tiny">Sum of entered kg × repetitions, excluding bodyweight and unweighted movements. This is not a complete measure of training effort.</p>'+(recent.length?'<div class="chart">'+recent.map(([d],i)=>'<div class="bar" style="height:'+Math.max(3,Math.round(values[i]/max*100))+'%"><span>'+d.slice(5)+'</span></div>').join('')+'</div>':'<div class="empty">Complete and confirm your first sets to see your performance chart.</div>')+'</section><section class="section panel"><h2>Body measurements</h2><div class="row"><input type="number" id="bodyweight" step="0.1" placeholder="Weight (kg)"><input type="number" id="waist" step="0.1" placeholder="Waist (cm), optional"><button class="primary" onclick="saveMeasurement()">Save measurement</button></div><div style="margin-top:15px">'+data.measurements.slice(-6).reverse().map(m=>'<div class="row between" style="padding:8px;border-bottom:1px solid #33404a"><span>'+esc(m.date)+'</span><strong>'+esc(m.weight)+' kg'+(m.waist?' · '+esc(m.waist)+' cm waist':'')+'</strong></div>').join('')+'</div></section>'}function saveMeasurement(){let w=Number(document.getElementById('bodyweight').value),waist=document.getElementById('waist').value;if(!w||w<20||w>400){alert('Enter a valid body weight');return}data.measurements.push({date:new Date().toISOString().slice(0,10),weight:w,waist:waist||null});save();render()}
function settings(){return pageHeader('Your settings','Private profile · Local-first data')+'<div class="panel" style="margin-top:24px"><h2>Profile</h2><div class="measure"><div><label class="field">Age</label><input id="age" type="number" value="'+esc(data.profile.age)+'"></div><div><label class="field">Height (cm)</label><input id="height" type="number" value="'+esc(data.profile.height)+'"></div><div><label class="field">Starting weight (kg)</label><input id="weight" type="number" value="'+esc(data.profile.weight)+'"></div></div><label class="field">Exercise restrictions / clinician guidance (optional)</label><textarea id="restrictions" placeholder="Add only if needed">'+esc(data.restrictions)+'</textarea><button class="primary" onclick="saveSettings()">Save profile</button></div><div class="panel" style="margin-top:15px"><h2>Your data, your device</h2><p class="muted">All entries are stored in this browser on this device. Export backups regularly. Clearing browser data can permanently remove local records.</p><div class="row"><button class="primary" onclick="exportJSON()">↓ Backup JSON</button><button class="secondary" onclick="exportCSV()">↓ Export sets CSV</button><label class="secondary" style="cursor:pointer">↑ Restore JSON<input class="hide" type="file" accept="application/json,.json" onchange="importJSON(event)"></label></div></div><div class="notice" style="margin-top:15px">Version 0.3 · Offline-capable after the page loads; installing as a Home Screen app requires HTTPS hosting and an installable app manifest. No cloud sync or AI services are enabled.</div>'}function saveSettings(){data.profile={age:Number(document.getElementById('age').value),height:Number(document.getElementById('height').value),weight:Number(document.getElementById('weight').value)};data.restrictions=document.getElementById('restrictions').value;save();render()}function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportJSON(){download('personal-fitness-hq-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json')}function exportCSV(){let rows=[['date','exercise','set','reps_or_seconds','weight_kg','confirmed','updated_at']];for(let [date,l] of Object.entries(data.logs))for(let s of l.sets||[])rows.push([date,ex(s.exerciseId)?.name||s.exerciseId,s.index+1,s.reps,s.weight??'',s.confirmed,s.updatedAt]);download('personal-fitness-hq-sets.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')}function importJSON(event){let f=event.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v.exercises)||!Array.isArray(v.routines)||typeof v.logs!=='object'||!v.profile)throw Error('Invalid backup structure');if(!confirm('Replace all current local app data with this backup? Export your current data first.'))return;data=v;save();render();alert('Backup restored')}catch(e){alert('Could not restore: '+e.message)}};reader.readAsText(f)}
// Guides are an optional display layer; missing assets must never block workout recording.
function movementArt(e,sequence=false){return window.FormArt?window.FormArt(e.id,e.name,sequence):'<span class="custom-art">Movement guide</span>'}
function historyFor(eid){let rows=[];for(let [date,log] of Object.entries(data.logs))for(let s of log.sets||[])if(s.exerciseId===eid&&s.confirmed)rows.push({...s,date});return rows.sort((a,b)=>b.date.localeCompare(a.date)||b.index-a.index)}
function previousHtml(eid){let h=historyFor(eid),last=h[0];return '<div class="previous">'+(last?'<strong>LAST VERIFIED:</strong> '+esc(fmt(last.date))+' · '+last.reps+' '+(ex(eid)?.kind==='seconds'?'sec':'reps')+(last.weight!==null?' @ '+last.weight+' kg':'')+' · '+h.length+' confirmed historical sets':'<strong>FIRST SESSION:</strong> No verified performance yet. Suggested numbers are from your physio screenshots.')+'</div>'}
let guideReturnFocus=null;
function closeDetail(){const overlay=document.getElementById('exerciseDetail');if(!overlay)return;overlay.remove();document.querySelector('.shell').inert=false;document.getElementById('mobileNav').inert=false;document.body.classList.remove('guide-open');guideReturnFocus?.focus()}
function detail(eid,trigger){
 const e=ex(eid);if(!e)return;
 closeDetail();guideReturnFocus=trigger||document.activeElement;
 const g=window.FormGuides?.[eid];
 const overlay=document.createElement('div');overlay.id='exerciseDetail';overlay.className='detail-overlay';
 overlay.innerHTML=`<section class="detail" role="dialog" aria-modal="true" aria-labelledby="guideTitle" tabindex="-1">
 <div class="guide-header"><span class="micro">MOVEMENT GUIDE</span><button type="button" class="ghost" data-close-guide aria-label="Close exercise guide">Close ✕</button></div>
 <div class="detail-visual">${movementArt(e,true)}</div>
 <div class="detail-content"><h2 id="guideTitle">${esc(e.name)}</h2>
 ${g?`<p class="variant">${esc(g.variant)}</p>${g.note?`<div class="notice variant-note">${esc(g.note)}</div>`:''}
 <h3>How to perform</h3><ol class="guide-steps">${g.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol><p class="guide-cue"><strong>Keep in mind</strong><br>${esc(g.cue)}</p>
 <div class="video-reference"><h3>Demonstration</h3><p>${esc(g.title)} · ${esc(g.publisher)}</p><a class="primary" data-video-link href="${esc(g.source)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Watch demonstration ↗</a><p class="tiny muted">Opens the publisher’s video page in a new tab. Internet required. Source checked ${esc(g.reviewed)}; availability may change.</p></div>`:'<div class="notice">No reviewed technique guide or demonstration is available for this custom exercise. Follow your own exercise instructions.</div>'}
 <details class="prescription"><summary>Prescription & verified history</summary><div class="detail-stats"><div><b>${esc(e.sets)}</b><small>Sets</small></div><div><b>${esc(e.reps)}</b><small>${e.kind==='seconds'?'Seconds':'Reps'}</small></div><div><b>${esc(e.rest)}s</b><small>Rest</small></div></div><p>Prescribed loads: ${e.weights?.length?e.weights.map(w=>esc(w)+' kg').join(' · '):'No load recorded'}</p>${previousHtml(eid)}<p class="tiny muted">Opening a guide or video never confirms a set.</p></details>
 <p class="tiny muted">General reference, not individual clinical instruction. Follow your physiotherapist’s prescribed range, setup and cervical-spine guidance.</p>
 ${data.restrictions?`<div class="notice"><strong>Your saved clinician guidance</strong><br>${esc(data.restrictions)}</div>`:''}
 </div></section>`;
 overlay.addEventListener('click',event=>{if(event.target===overlay||event.target.closest('[data-close-guide]'))closeDetail()});
 overlay.addEventListener('keydown',event=>{
  if(event.key==='Escape'){event.preventDefault();closeDetail();return}
  if(event.key==='Tab'){
   const focusable=[...overlay.querySelectorAll('button,a[href],summary')].filter(el=>el.getClientRects().length);
   const first=focusable[0],last=focusable[focusable.length-1];
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
 });
 document.body.appendChild(overlay);document.querySelector('.shell').inert=true;document.getElementById('mobileNav').inert=true;document.body.classList.add('guide-open');overlay.querySelector('button').focus();
}
document.addEventListener('click',event=>{const button=event.target.closest('[data-guide]');if(button)detail(button.dataset.guide,button)});

function render(){nav();document.getElementById('app').innerHTML=({Dashboard:dashboard,Calendar:calendar,Workout:workout,Exercises:exercises,Progress:progress,Settings:settings}[view])();updateTimer()}try{render()}catch(err){document.getElementById('app').innerHTML='<div style="padding:30px;color:white"><h1>FORM. v0.3.2</h1><p>App startup issue detected.</p><pre style="white-space:pre-wrap">'+esc(err.message)+'</pre></div>';console.error(err)}
</script></body></html>
