tartTimer(90)">90s rest</button><button class="secondary" onclick="startTimer(120)">2m rest</button><button class="ghost" onclick="stopTimer()">Stop</button></div></div><div class="notice" style="margin-top:12px">Only sets you explicitly confirm count towards your results. Prescriptions are targets, not proof of completed performance. Original physiotherapy groupings remain provisional.</div>';for(const eid of r.ids){const e=plan.exercises.find(e=>e.id===eid);if(!e)continue;let records=data.logs[selected]?.sets||[];html+='<div class="workout-ex"><div class="ex-title"><div><h3>'+esc(e.name)+'</h3><p>'+esc(e.group)+' · '+e.sets+' sets · '+e.rest+' sec rest</p></div><button type="button" data-guide="'+esc(eid)+'" aria-label="View guide: '+esc(e.name)+'">Guide ↗</button></div>'+previousHtml(eid)+'<div class="sethead"><div>Set</div><div>'+(e.kind==='seconds'?'Seconds':'Reps')+'</div><div>Weight kg</div><div>Done</div></div>';for(let i=0;i<Math.max(e.sets,...records.filter(s=>s.exerciseId===eid).map(s=>s.index+1));i++){let s=records.find(x=>x.exerciseId===eid&&x.index===i);let rep=s?s.reps:e.reps,wt=s?s.weight:(e.weights[i]??'');html+='<div class="tiny muted">'+(plan.provenance==='legacy-reference'?'Reference only':'Target')+': '+esc(e.reps)+' '+(e.kind==='seconds'?'seconds':'reps')+(e.weights[i]!==null&&e.weights[i]!==undefined&&e.weights[i]!==''?' @ '+esc(e.weights[i])+' kg':' · load not specified')+'</div><div class="setrow"><b>'+(i+1)+'</b><input aria-label="Repetitions for '+esc(e.name)+' set '+(i+1)+'" type="number" min="0" step="1" id="rep-'+eid+'-'+i+'" value="'+esc(rep)+'" oninput="markEdited(\''+eid+'\','+i+')"><input aria-label="Weight for '+esc(e.name)+' set '+(i+1)+'" type="number" min="0" step="0.5" id="wt-'+eid+'-'+i+'" placeholder="—" value="'+esc(wt)+'" oninput="markEdited(\''+eid+'\','+i+')"><button id="check-'+eid+'-'+i+'" class="'+(s?.confirmed?'checked':'')+'" onclick="confirmSet(\''+eid+'\','+i+')" aria-label="Confirm set">'+(s?.confirmed?'✓':'○')+'</button></div>'}html+='<div class="row between"><span class="completed" data-exercise="'+esc(eid)+'">'+records.filter(s=>s.exerciseId===eid&&s.confirmed).length+' / '+e.sets+' confirmed</span><button class="ghost" onclick="startTimer('+e.rest+')">Rest '+e.rest+'s ↻</button></div></div>'}return html+'<div class="panel"><div class="row between"><div><strong>Session progress</strong><div class="muted tiny" id="sessionCount">'+confirmed(selected).length+' verified sets recorded</div></div><button class="primary" onclick="finishWorkout()">Finish session ✓</button></div></div>'}

function markEdited(eid,i){
 const rep=document.getElementById('rep-'+eid+'-'+i).value,w=document.getElementById('wt-'+eid+'-'+i).value;

function confirmSet(eid,i){let reps=Number(document.getElementById('rep-'+eid+'-'+i).value),w=document.getElementById('wt-'+eid+'-'+i).value;if(document.getElementById('rep-'+eid+'-'+i).value===''||!Number.isFinite(reps)||reps<0||!Number.isInteger(reps)||w!==''&&(!Number.isFinite(Number(w))||Number(w)<0)){alert('Please enter valid repetitions and weight.');return}let log=FormProgram.record(data,activeProfile,selected);let pos=log.sets.findIndex(s=>s.exerciseId===eid&&s.index===i);let prev=pos>=0?log.sets[pos]:null;let obj={...prev,exerciseId:eid,index:i,reps,weight:w===''?null:Number(w),confirmed:!prev?.confirmed,updatedAt:new Date().toISOString()};if(pos>=0)log.sets[pos]=obj;else log.sets.push(obj);if(!save())return;let b=document.getElementById('check-'+eid+'-'+i);b.classList.toggle('checked',obj.confirmed);b.textContent=obj.confirmed?'✓':'○';updateCounts();}function finishWorkout(){let c=confirmed(selected).length;if(!c){alert('Confirm at least one completed set before finishing.');return}data.logs[selected].finishedAt=new Date().toISOString();if(!save())return;alert('Workout saved locally: '+c+' confirmed sets.');navigate('Dashboard')}
function startTimer(seconds){timerUntil=Date.now()+seconds*1000;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimer,250);updateTimer()}function stopTimer(){timerUntil=0;if(timerInterval)clearInterval(timerInterval);updateTimer()}function updateTimer(){let el=document.getElementById('timerDisplay');if(!el)return;let s=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s&&timerInterval){clearInterval(timerInterval);timerInterval=null}}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let html=pageHeader('Training calendar',scheduleSummary()+' · Unlimited future planning')+'<div class="row" style="margin-top:20px"><button class="primary" onclick="editSchedule()">Edit weekly schedule</button></div><div class="panel" style="margin-top:24px"><div class="row between"><button class="secondary" onclick="moveMonth(-1)">←</button><h2>'+first.toLocaleDateString('en-AU',{month:'long',year:'numeric'})+'</h2><button class="secondary" onclick="moveMonth(1)">→</button></div><div class="calendar">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(x=>'<div class="calhead">'+x+'</div>').join('');for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){let d=new Date(y,m,i-offset+1),s=iso(d),r=routineFor(s),c=confirmed(s).length;html+='<button class="calcell '+(d.getMonth()!==m?'other ':'')+(r?'scheduled ':'')+(c?'done ':'')+(s===selected?'selected':'')+'" onclick="selectCalendarDate(\''+s+'\')">'+d.getDate()+'<small>'+(c?'✓ '+c+' sets':r?'● '+r:'')+'</small></button>'}html+='</div></div><div class="panel" style="margin-top:14px"><div class="row between"><div><strong>'+fmt(selected)+'</strong><div class="muted tiny">'+(routineFor(selected)?esc(routine(routineFor(selected))?.name):'Recovery / unscheduled')+'</div></div><button class="primary" onclick="navigate(\'Workout\')">Open day →</button></div></div>';return html}function moveMonth(n){month.setMonth(month.getMonth()+n);render()}function selectCalendarDate(s){selected=s;render()}
function exercises(){return pageHeader('Exercise library',data.exercises.length+' movements · Original library and your additions')+'<div class="notice" style="margin:20px 0">Open any movement for diagrams, step-by-step cues and a demonstration source. These are general technique references; your physiotherapist’s instructions take priority. Original workout groupings remain provisional.</div><div class="row between" style="margin-bottom:15px"><h2>All movements</h2><div class="row"><button class="secondary" onclick="importWorkout()">Import workout</button><button class="primary" onclick="addExercise()">+ Add exercise</button></div></div>'+exerciseCards(data.exercises)+programHtml()}function importWorkout(){FormImport.open({library:data.exercises,today:selected,escape:esc,onSave:({name,date,exercises})=>{if(data.logs[date]?.sets.length||data.logs[date]?.plan){alert('This date has a recorded session. Import onto another date to preserve it.');return false}if(data.overrides[date]!==undefined||data.logs[date]){if(!confirm('This date already has a schedule override or workout record. Replace its scheduled routine? Recorded performance will be kept.'))return false}const id='import-'+crypto.randomUUID();data.exercises.push(...exercises);data.routines.push({id,name,note:'Imported and reviewed by '+activeProfile+'. Refer to the original instructions.',ids:exercises.map(e=>e.id)});data.overrides[date]=id;if(!save())return false;selected=date;view='Workout';render();return true}})}
function addExercise(){document.getElementById('exerciseEditor')?.remove();const dialog=document.createElement('dialog');dialog.id='exerciseEditor';dialog.className='panel';dialog.innerHTML=`<form id="customExerciseForm"><h2>Add exercise or activity</h2><p>Only enter prescriptions you know. New exercises do not create completed sets.</p><label class="field" for="customName">Name</label><input id="customName" required maxlength="120"><label class="field" for="customCategory">Activity</label><select id="customCategory">${['Strength','Yoga','Pilates','Mobility','Stretching','Running','Walking','Cycling','Swimming','Conditioning','Custom'].map(c=>'<option>'+c+'</option>').join('')}</select><div class="measure"><label class="field">Sets<input id="customSets" type="number" min="1" max="100" required></label><label class="field">Repetitions or seconds<input id="customReps" type="number" min="0" step="1" required></label><label class="field">Unit<select id="customUnit"><option value="reps">Repetitions</option><option value="seconds">Seconds</option></select></label></div><label class="field">Rest (seconds)<input id="customRest" type="number" min="0" value="0" required></label><label class="field">Instructions<textarea id="customInstructions"></textarea></label><label class="field">Equipment<input id="customEquipment"></label><label class="field">Notes<textarea id="customNotes"></textarea></label><label class="field">Demonstration link (optional)<input id="customVideo" type="url" placeholder="https://"></label><label class="field">Add to workout<select id="customRoutine"><option value="">Library only</option>${data.routines.map(r=>'<option value="'+esc(r.id)+'">'+esc(r.name)+'</option>').join('')}</select><p id="customError" role="alert"></p><div class="row"><button type="submit" class="primary">Save exercise</button><button type="button" class="secondary" onclick="document.getElementById('exerciseEditor').close()">Cancel</button></div></form>`;document.body.appendChild(dial function progress(){let logs=Object.entries(data.logs).filter(([d,l])=>(l.sets||[]).some(s=>s.confirmed)).sort((a,b)=>a[0].localeCompare(b[0]));let recent=logs.slice(-8),values=recent.map(([d,l])=>l.sets.filter(s=>s.confirmed).reduce((a,s)=>a+(!['strength','reps'].includes(recordExercise(d,s.exerciseId)?.kind)?0:(s.weight||0)*s.reps),0)),max=Math.max(1,...values);return pageHeader('Progress & insights','Only confirmed training contributes to statistics')+'<div class="stats" style="margin-top:24px"><div class="stat"><div class="label">Verified workouts</div><div class="number">'+countWorkouts()+'</div></div><div class="stat"><div class="label">Confirmed sets</div><div class="number">'+totalConfirmed()+'</div></div><div class="stat"><div class="label">Height</div><div class="number">'+data.profile.height+'<small> cm</small></div></div><div class="stat"><div class="label">Starting weight</div><div class="number">'+data.profile.weight+'<small> kg</small></div></div></div><section class="section panel"><h2>Confirmed external-load volume</h2><p class="muted tiny">Sum of entered kg × repetitions, excluding bodyweight and unweighted movements. This is not a complete measure of training effort.</p>'+(recent.length?'<div class="chart">'+recent.map(([d],i)=>'<div class="bar" style="height:'+Math.max(3,Math.round(values[i]/max*100))+'%"><span>'+d.slice(5)+'</span></div>').join('')+'</div>':'<div class="empty">Complete and confirm your first sets to see your performance chart.</div>')+'</section>'+activityHtml()+coachingHtml()+'<section class="section panel"><h2>Body measurements</h2><div class="row"><input type="number" id="bodyweight" step="0.1" placeholder="Weight (kg)"><input type="number" id="waist" step="0.1" placeholder="Waist (cm), optional"><button class="primary" onclick="saveMeasurement()">Save measurement</button></div><div style="margin-top:15px">'+data.measurements.slice(-6).reverse().map(m=>'<div class="row between" style="padding:8px;border-bottom:1px solid #3340 function settings(){return pageHeader('Your settings','Private profile · Local-first data')+'<div class="panel" style="margin-top:24px"><h2>'+activeProfile+'’s profile</h2><p class="muted tiny">Profiles are separate on this device. They do not sync between phones. Zero means a measurement has not been entered.</p><div class="measure"><div><label class="field">Age</label><input id="age" type="number" value="'+esc(data.profile.age)+'"></div><div><label class="field">Height (cm)</label><input id="height" type="number" value="'+esc(data.profile.height)+'"></div><div><label class="field">Starting weight (kg)</label><input id="weight" type="number" value="'+esc(data.profile.weight)+'"></div></div><label class="field">Exercise restrictions / clinician guidance (optional)</label><textarea id="restrictions" placeholder="Add only if needed">'+esc(data.restrictions)+'</textarea><button class="primary" onclick="saveSettings()">Save profile</button></div><div class="panel" style="margin-top:15px"><h2>Your data, your device</h2><p class="muted">Backups and restores apply only to '+activeProfile+'. All entries are stored in this browser on this device. Export backups regularly. Clearing browser data can permanently remove local records.</p><div class="row"><button class="primary" onclick="exportJSON()">↓ Backup JSON</button><button class="secondary" onclick="exportRecovery()">Download pre-restore copy</button><button class="secondary" onclick="exportCSV()">↓ Export sets CSV</button><label class="secondary" style="cursor:pointer">↑ Restore JSON<input class="hide" type="file" accept="application/json,.json" onchange="importJSON(event)"></label></div></div><div class="notice" style="margin-top:15px">Version 0.6 · Works offline while the page remains loaded; installing as a Home Screen app requires HTTPS hosting and an installable app manifest. No cloud sync or external AI services are enabled. Local coaching uses fixed rules.</div>'}function saveSettings(){data.profile={age:Number(do ved data was not changed.');reader.readAsText(f)}
function exportRecovery(){try{const raw=localStorage.getItem(KEY+'-before-restore');if(raw===null){alert('No previous restore copy is available.');return}let exported=raw;try{const parsed=JSON.parse(raw);FormStore.validate(parsed);exported=JSON.stringify({...parsed,backupProfile:activeProfile},null,2)}catch{}download('form-'+activeProfile.toLowerCase()+'-before-restore.json',exported,'application/json')}catch(e){alert('Could not access recovery copy: '+e.message)}}
function recoveryScreen(){return '<div class="panel"><h1>Saved data needs attention</h1><p>Profile: '+activeProfile+'</p><button class="secondary" onclick="switchProfile(activeProfile===\'Ben\'?\'Georgie\':\'Ben\')">Switch profile</button><p>Your original records have not been overwritten. Download the original data before restoring a known good backup.</p><p>'+esc(store.error?.message)+'</p><div class="row"><button class="primary" onclick="download(\'form-original-data.txt\',store.raw??\'\',\'text/plain\')">Download original data</button><label class="secondary">Restore backup<input type="file" accept=".json,application/json" onchange="importJSON(event)"></label></div></div>'}

// Guides are an optional display layer; missing assets must never block workout recording.
function movementArt(e,sequence=false){return window.FormArt?window.FormArt(e.sourceExerciseId||e.id,e.name,sequence):'<span class="custom-art">Movement guide</span>'}
function historyFor(eid){let rows=[];for(let [date,log] of Object.entries(data.logs))for(let s of log.sets||[])if(s.exerciseId===eid&&s.confirmed)rows.push({...s,date});return rows.sort((a,b)=>b.date.localeCompare(a.date)||b.index-a.index)}
function previousHtml(eid){let h=historyFor(eid).filter(s=>s.date<selected),last=h[0];return '<div class="previous">'+(last?'<strong>LAST VERIFIED:</strong> '+esc(fmt(last.date))+' · '+last.reps+' '+(recordExercise(last.date,eid)?.kind==='seconds'?'sec':'reps')+(last.weight!==null?' @ '+last.weight+' kg':'')+' · '+h.length+' confirmed historical sets':'<strong>FIRST SESSION:</strong> No verified performance yet. Suggested numbers are from your physio screenshots.')+'</div>'}
let guideReturnFocus=null;
function closeDetail(){const overlay=document.getElementById('exerciseDetail');if(!overlay)return;overlay.remove();document.querySelector('.shell').inert=false;document.getElementById('mobileNav').inert=false;document.body.classList.remove('guide-open');guideReturnFocus?.focus()}
function detail(eid,trigger){
 const e=view==='Workout'?sessionExercise(eid):ex(eid);if(!e)return;
 closeDetail();guideReturnFocus=trigger||document.activeElement;
 const g=window.FormGuides?.[e.sourceExerciseId||eid];
 const overlay=document.createElement('div');overlay.id='exerciseDetail';overlay.className='detail-overlay';
 overlay.innerHTML=`<section class="detail" role="dialog" aria-modal="true" aria-labelledby="guideTitle" tabindex="-1">
 <div class="guide-header"><span class="micro">MOVEMENT GUIDE</span><button type="button" class="ghost" data-close-guide aria-label="Close exercise guide">Close ✕</button></div>
 <div class="detail-visual">${movementArt(e,true)}</div>
 <div class="detail-content"><h2 id="guideTitle">${esc(e.name)}</h2>
 ${g?`<p class="variant">${esc(g.variant)}</p>${g.note?`<div class="notice variant-note">${esc(g.note)}</div>`:''}
 <h3>How to perform</h3><ol class="guide-steps">${g.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol><p class="guide-cue"><strong>Keep in mind</strong><br>${esc(g.cue)}</p>
 <div class="video-reference"><h3>Demonstration</h3><p>${esc(g.title)} · ${esc(g.publisher)}</p><div class="video-player" data-video-exercise="${esc(e.sourceExerciseId||eid)}"><button type="button" class="primary" data-play-video>Play demonstration</button></div><p class="tiny muted" data-video-status aria-live="polite">Plays here in your exercise guide. Internet required; the video loads from ${esc(g.publisher)} when you press Play.</p><p class="tiny muted">If playback is unavailable, <a data-video-link href="${esc(g.source)}" target="_blank" rel="noopener noreferrer">open the publisher’s page ↗</a>.</p></div>`:'<div class="notice">No reviewed technique guide or demonstration is available for this custom exercise. Follow your own exercise instructions.</div>'}
 ${e.instructions?`<h3>Your instructions</h3><p style="white-space:pre-wrap">${esc(e.instructions)}</p>`:''}${e.equipment?`<p><strong>Equipment:</strong> ${esc(e.equipment)}</p>`:''}${e.notes?`<p style="white-space:pre-wrap">${esc(e.notes)}</p>`:''}${e.video&&/^https:\/\//i.test(e.video)?`<p><a href="${esc(e.video)}" target="_blank" rel="noopener noreferrer">Open your demonstration link ↗</a><br><small>User supplied; not independently reviewed.</small></p>`:''}<details class="prescription"><summary>Prescription & verified history</summary><div class="detail-stats"><div><b>${esc(e.sets)}</b><small>Sets</small></div><div><b>${esc(e.reps)}</b><small>${e.kind==='seconds'?'Seconds':'Reps'}</small></div><div><b>${esc(e.rest)}s</b><small>Rest</small></div></div><p>Prescribed loads: ${e.weights?.length?e.weights.map(w=>esc(w)+' kg').join(' · '):'No load recorded'}</p>${previousHtml(eid)}<p class="tiny muted">Opening a guide or video never confirms a set.</p></details>
 <p class="tiny muted">General reference, not individual clinical instruction. Follow your physiotherapist’s prescribed range, setup and cervical-spine guidance.</p>
 ${data.restrictions?`<div class="notice"><strong>Your saved clinician guidance</strong><br>${esc(data.restrictions)}</div>`:''}
 </div></section>`;
 overlay.addEventListener('click',event=>{if(event.target===overlay||event.target.closest('[data-close-guide]'))closeDetail()});
 overlay.addEventListener('keydown',event=>{
  if(event.key==='Escape'){event.preventDefault();closeDetail();return}
  if(event.key==='Tab'){
   const focusable=[...overlay.querySelectorAll('button,a[href],summary,iframe,video[controls]')].filter(el=>el.getClientRects().length);
   const first=focusable[0],last=focusable[focusable.length-1];
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
 });
 document.body.appendChild(overlay);document.querySelector('.shell').inert=true;document.getElementById('mobileNav').inert=true;document.body.classList.add('guide-open');overlay.querySelector('button').focus();
}
document.addEventListener('click',event=>{const button=event.target.closest('[data-guide]');if(button)detail(button.dataset.guide,button)});

function render(){if(!data){document.getElementById('desktopNav').innerHTML='';document.getElementById('mobileNav').innerHTML='';document.getElementById('app').innerHTML=recoveryScreen();return}nav();document.getElementById('app').innerHTML=({Dashboard:dashboard,Calendar:calendar,Workout:workout,Exercises:exercises,Progress:progress,Settings:settings}[view])();updateTimer()}try{let preferred='Ben';try{preferred=localStorage.getItem('form-active-profile')}catch{}if(preferred==='Georgie')switchProfile('Georgie');else render()}catch(err){document.getElementById('app').innerHTML='<div style="padding:30px;color:white"><h1>FORM. v0.6</h1><p>App startup issue detected.</p><pre style="white-space:pre-wrap">'+esc(err.message)+'</pre></div>';console.error(err)}
</script></body></html>
