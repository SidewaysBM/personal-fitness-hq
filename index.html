 class="secondary" data-action-click="exportCSV()">↓ Export sets CSV</button><button class="secondary" data-action-click="exportSessionChanges()">Export session changes CSV</button><label class="secondary" style="cursor:pointer">↑ Restore JSON<input class="hide" type="file" accept="application/json,.json" data-action-change="importJSON(event)"></label></div></div><div class="notice" style="margin-top:15px">Version 0.21.0 · Offline startup is available after the app has been cached on HTTPS hosting. No cloud sync or external AI services are enabled. Local coaching uses fixed rules.</div>'}async function saveSettings(){data.profile={age:Number(document.getElementById('age').value),height:Number(document.getElementById('height').value),weight:Number(document.getElementById('weight').value)};data.restrictions=document.getElementById('restrictions').value;await save();render()}function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportJSON(){download('form-'+activeProfile.toLowerCase()+'-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...data,backupProfile:activeProfile},null,2),'application/json');try{localStorage.setItem(KEY+'-last-backup',String(Date.now()))}catch{}}function downloadCSV(name,rows){download(name,rows.map(r=>r.map(v=>{let text=String(v??'');if(typeof v==='string'&&/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'}).join(',')).join('\r\n'),'text/csv')}
function exportCSV(){const rows=[['date','exercise','set','reps_or_seconds','weight_kg','confirmed','updated_at','prescribed_exercise','session_id']];for(const [date,log,sessionId] of FormSession.entries(data))for(const set of log.sets||[]){const original=Object.entries(log.changes||{}).find(([,c])=>c.replacement?.id===set.exerciseId)?.[0]||set.exerciseId;rows.push([date,recordExercise(date,set.exerciseId,sessionId)?.name||set.exerciseId,set.index+1,set.reps,set.weight??'',set.confirmed,set.updatedAt,recordExercise(date,original,sessionId)?.name||original,sessionId||'primary'])}downloadCSV('personal-fitness-hq-sets.csv',rows)}
function exportActivities(){const keys=['date','category','minutes','distanceKm','activeEnergyKcal','averageHeartRateBpm','maximumHeartRateBpm','confirmed','source','sourceName','sourceStart','notes','id'];downloadCSV('form-'+activeProfile.toLowerCase()+'-activities.csv',[['date','activity','minutes','distance_km','active_energy_kcal','average_heart_rate_bpm','maximum_heart_rate_bpm','confirmed','source','source_name','source_start','notes','id'],...(data.activities||[]).map(r=>keys.map(k=>r[k]??''))])}

async function restoreCandidate(value,profile,sourceStore){
 if(profile!==activeProfile||sourceStore!==store)throw Error('The active profile changed while the backup was being read. Select the file again in the intended profile.');
 const v=FormStore.validate(value);if(v.backupProfile&&v.backupProfile!==profile)throw Error('This backup belongs to '+v.backupProfile+'. Switch to that profile before restoring.');if(!v.backupProfile&&profile==='Georgie')throw Error('Legacy backups belong to Ben. Switch to Ben to restore this backup.');
 const message='Review restore for '+profile+'\n\nCURRENT DEVICE\n'+backupSummaryText(sourceStore.value)+'\n\nINCOMING BACKUP\n'+backupSummaryText(v)+'\n\nCounts include all saved dates and partial sessions. This replaces this profile’s data; it does not merge records. Other profiles are unchanged. The current saved data replaces the previous recovery copy. Download that copy first if you need to keep it.\n\nRestore this backup?';
 if(saving)throw Error('Wait for the current save to finish.');
 if(!confirm(message))return false;
 saving=true;saveShield(true);try{await sourceStore.write(v,true);if(store!==sourceStore||activeProfile!==profile)throw Error('Profile changed during restore. Reload the intended profile.');data=structuredClone(sourceStore.value);activeSessionId='';stopTimer();render();alert('Backup restored. Your previous saved data is available in Settings.');return true}finally{saving=false;saveShield(false)}
}
function importJSON(event){const input=event.target,f=input.files?.[0],profile=activeProfile,sourceStore=store;if(!f)return;const reader=new FileReader();reader.onload=async ()=>{try{await restoreCandidate(JSON.parse(reader.result),profile,sourceStore)}catch(e){alert('Could not restore: '+e.message)}finally{input.value=''}};reader.onerror=()=>{input.value='';alert('Could not read this file. Your saved data was not changed.')};reader.readAsText(f)}
async function restoreRecovery(){try{const raw=(store.encrypted?store.recovery():localStorage.getItem(KEY+'-before-restore'));if(raw===null){alert('No previous restore copy is available.');return}const previous=FormStore.validate(JSON.parse(raw));await restoreCandidate({...previous,backupProfile:previous.backupProfile||activeProfile},activeProfile,store)}catch(e){alert('Could not restore recovery copy: '+e.message)}}
function exportRecovery(){try{const raw=(store.encrypted?store.recovery():localStorage.getItem(KEY+'-before-restore'));if(raw===null){alert('No previous restore copy is available.');return}let exported=raw;try{const parsed=JSON.parse(raw);FormStore.validate(parsed);exported=JSON.stringify({...parsed,backupProfile:activeProfile},null,2)}catch{}download('form-'+activeProfile.toLowerCase()+'-before-restore.json',exported,'application/json')}catch(e){alert('Could not access recovery copy: '+e.message)}}

 saving=true;saveShield(true);try{store=await FormVault.enable(localStorage,id,source,pin);data=structuredClone(store.value);d.close();render()}catch(e){error.textContent=e.message}finally{saving=false;saveShield(false)}

for(const type of ['click','change','submit','input'])document.addEventListener(type,event=>{
 const element=event.target.closest('[data-action-'+type+']');if(!element)return;
 if(type==='submit')event.preventDefault();
 const action=element.getAttribute('data-action-'+type),match=/^(\w+)\((.*)\)$/.exec(action);
 if(!match||!Object.hasOwn(formActions,match[1]))throw Error('Unknown interface action');
 const parts=match[2]?match[2].match(/'(?:[^'\\]|\\.)*'|this\.(?:value|checked)|event|currentDay\(\)|-?\d+(?:\.\d+)?/g)||[]:[];
 if(parts.join(',')!==match[2])throw Error('Invalid interface action arguments');
 const args=parts.map(value=>value==='event'?event:value==='this.value'?element.value:value==='this.checked'?element.checked:value==='currentDay()'?currentDay():value.startsWith("'")?value.slice(1,-1):Number(value));
 formActions[match[1]](...args);
});
